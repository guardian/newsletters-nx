packages:
  - 'apps/*'
  - 'libs/*'
allowBuilds:
  esbuild: true
  unrs-resolver: true
engineStrict: true
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@guardian/*'
overrides:
  'js-yaml@^3': '^3.15.0'
  'js-yaml@^4': '^4.3.0'
  'brace-expansion@^1': '^1.1.16'
  'brace-expansion@^2': '^2.1.2'
  'brace-expansion@^5': '^5.0.8'
  'fast-uri': '>=3.1.1'
  'qs': '^6.15.1'
  'handlebars@^4': '>=4.7.9'
  'minimatch@^3': '^3.1.5'
  'minimatch@^5': '^5.1.8'
  'path-to-regexp@^8': '^8.4.0'
  'flatted@^3': '^3.4.2'
  'form-data': '>=4.0.6'
