name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true
jobs:
  # E2E tests run in parallel with build/test
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Image tag must match the @playwright/test version
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      USE_IN_MEMORY_STORAGE: 'true'
      CI: 'true'
      USE_DEVELOPER_PROFILE: 'true'
      USE_LOCAL_USER_PERMISSIONS: 'true'
      LOCAL_USER_PROFILE_EMAIL: 'e2e-test@example.com'
      USER_PERMISSIONS: '{"e2e-test@example.com":0}'
      ENABLE_TEST_FIXTURES: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm ci

      - name: Build UI and API
        run: |
          pnpm run bundle:ui
          pnpm run bundle:api

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles
          path: |
            dist/apps/newsletters-api
            dist/apps/newsletters-ui
          retention-days: 1

      - name: Run Playwright E2E tests
        run: pnpm run test:e2e

      # Sometimes the 'Run Playwright E2E tests' step may not fail even if some tests fail, so we double check by reading the summary report.
      - name: Double check Playwright E2E tests
        if: always()
        env:
          PLAYWRIGHT_SUMMARY_REPORT_PATH: dist/.playwright/apps/newsletters-e2e/playwright-report/summary.txt
          PLAYWRIGHT_SUMMARY_SUCCESS_VALUE: passed
        run: |
          # Fail if the playwright summary report does not indicate success.
          # This is a workaround for an intermittent issue where the 'Run Playwright E2E tests' step may not fail even if some tests fail.
          if  [ -f "$PLAYWRIGHT_SUMMARY_REPORT_PATH" ] && [ "$PLAYWRIGHT_SUMMARY_SUCCESS_VALUE" = "$(cat $PLAYWRIGHT_SUMMARY_REPORT_PATH)" ]; then
            echo "E2E tests succeeded."
            exit 0
          else
            echo "E2E tests failed with status '$(cat $PLAYWRIGHT_SUMMARY_REPORT_PATH)'. Check the Playwright report for details."
            exit 1
          fi

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            dist/.playwright/apps/newsletters-e2e/playwright-report/
            apps/newsletters-e2e/playwright-report/
          retention-days: 30
          if-no-files-found: error

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-test-results
          path: |
            dist/.playwright/apps/newsletters-e2e/test-results/
            apps/newsletters-e2e/test-results/
          retention-days: 7
          if-no-files-found: error
          # We want to upload '.last-run.json'
          include-hidden-files: true

  # Build, lint, and unit test job
  build-and-test:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm ci

      - name: Lint and test
        run: |
          pnpm run lint
          pnpm run test

      - name: Build and synth CDK
        working-directory: ./cdk
        run: |
          npm ci
          npm run lint
          npm run test
          npm run synth

      - name: Upload CDK templates
        uses: actions/upload-artifact@v7
        with:
          name: cdk-out
          path: cdk/cdk.out
          retention-days: 1

  # Deploy job - waits for E2E tests (which build the bundles) and build/test (which synths CDK)
  deploy:
    name: Deploy to riff-raff
    runs-on: ubuntu-latest
    needs: [e2e-tests, build-and-test] # Wait for both jobs
    permissions:
      id-token: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          name: bundles
          path: dist/apps

      - name: Download CDK templates
        uses: actions/download-artifact@v8
        with:
          name: cdk-out
          path: cdk/cdk.out

      - name: Zip bundles
        run: |
          zip -r dist/newsletters-tool.zip dist
          cp dist/newsletters-tool.zip dist/newsletters-api.zip

        # Upload artifacts for newsletters internal tool
      - name: Upload riff-raff artifacts - newsletters-tool
        uses: guardian/actions-riff-raff@v4
        with:
          app: newsletters-tool
          configPath: riff-raff.yaml
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          contentDirectories: |
            newsletters-tool-cfn:
              - cdk/cdk.out/NewslettersTool-CODE.template.json
              - cdk/cdk.out/NewslettersTool-PROD.template.json
            newsletters-tool:
              - dist/newsletters-tool.zip
            newsletters-api:
              - dist/newsletters-api.zip
