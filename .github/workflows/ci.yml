name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true
jobs:
  # E2E tests run in parallel with build/test.
  # The suite is sharded across several jobs. Each shard starts its own API
  # server with its own in-memory storage, so shards can't race on shared data
  # (tests within a shard still run serially - see playwright.config.ts).
  e2e-tests:
    name: E2E Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    env:
      USE_IN_MEMORY_STORAGE: 'true'
      CI: 'true'
      USE_DEVELOPER_PROFILE: 'true'
      USE_LOCAL_USER_PERMISSIONS: 'true'
      LOCAL_USER_PROFILE_EMAIL: 'e2e-test@example.com'
      USER_PERMISSIONS: '{"e2e-test@example.com":0}'
      ENABLE_TEST_FIXTURES: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm ci
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Build UI for E2e tests
        run: pnpm --filter=@newsletters-nx/newsletters-ui build
      # Start API server in background with UI serving enabled
      - name: Start API Server
        env:
          USE_DEVELOPER_PROFILE: 'true'
          NEWSLETTERS_UI_SERVE: 'true'
        run: |
          pnpm --filter=@newsletters-nx/newsletters-api serve &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          echo "Waiting for API to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/newsletters > /dev/null 2>&1; then
              echo "API server is ready on port 3000"
              break
            fi
            echo "⏳ Waiting for API server... ($i/30)"
            sleep 2
          done
          curl -s http://localhost:3000/api/newsletters || echo "API might not be fully ready"
      - name: Run Playwright E2E tests
        run: pnpm run test:e2e --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      # Sometimes the 'Run Playwright E2E tests' step may not fail even if some tests fail, so we double check by reading the summary report.
      - name: Double check Playwright E2E tests
        if: always()
        env:
          PLAYWRIGHT_SUMMARY_REPORT_PATH: dist/.playwright/apps/newsletters-e2e/playwright-report/summary.txt
          PLAYWRIGHT_SUMMARY_SUCCESS_VALUE: passed
        run: |
          # Fail if the playwright summary report does not indicate success.
          # This is a workaround for an intermittent issue where the 'Run Playwright E2E tests' step may not fail even if some tests fail.
          if  [ -f "$PLAYWRIGHT_SUMMARY_REPORT_PATH" ] && [ "$PLAYWRIGHT_SUMMARY_SUCCESS_VALUE" = "$(cat $PLAYWRIGHT_SUMMARY_REPORT_PATH)" ]; then
            echo "E2E tests succeeded."
            exit 0
          else
            echo "E2E tests failed with status '$(cat $PLAYWRIGHT_SUMMARY_REPORT_PATH)'. Check the Playwright report for details."
            exit 1
          fi
      # Stop API server after tests
      - name: Stop API Server
        if: always()
        run: |
          if [ ! -z "$API_PID" ]; then
            kill $API_PID 2>/dev/null || true
          fi
          # Also kill any remaining processes on port 3000
          lsof -ti:3000 | xargs kill -9 2>/dev/null || true
      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: dist/.playwright/apps/newsletters-e2e/blob-report/
          retention-days: 1
          if-no-files-found: error
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-test-results-${{ matrix.shardIndex }}
          path: |
            dist/.playwright/apps/newsletters-e2e/test-results/
            apps/newsletters-e2e/test-results/
          retention-days: 7
          if-no-files-found: error
          # We want to upload '.last-run.json'
          include-hidden-files: true
  # Merge the per-shard blob reports into a single HTML report
  merge-e2e-reports:
    name: Merge E2E reports
    if: ${{ !cancelled() }}
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm ci
      - name: Download blob reports
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: error
  # Build, lint, and unit test job
  build-and-test:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm ci

      - name: Lint and test
        run: |
          pnpm run lint
          pnpm run test

      - name: Build and synth CDK
        working-directory: ./cdk
        run: |
          npm ci
          npm run lint
          npm run test
          npm run synth

  # Deploy job - waits for both E2E tests and build/test to pass
  deploy:
    name: Build, test and deploy to riff-raff
    runs-on: ubuntu-latest
    needs: [e2e-tests, build-and-test] # Wait for both jobs
    permissions:
      id-token: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

        # Install then build production-ready bundled files
      - name: Install deps
        run: |
          pnpm ci
      - name: lint and test
        run: |
          pnpm run lint
          pnpm run test

      - name: Bundle and zip
        run: |
          pnpm run bundle:ui
          pnpm run bundle:api
          zip -r dist/newsletters-tool.zip dist
          cp dist/newsletters-tool.zip dist/newsletters-api.zip

        # Build Cloudformation definition from CDK
      - name: Build and synth CDK
        working-directory: ./cdk
        run: |
          npm ci
          npm run lint
          npm run test
          npm run synth

        # Upload artifacts for newsletters internal tool
      - name: Upload riff-raff artifacts - newsletters-tool
        uses: guardian/actions-riff-raff@v4
        with:
          app: newsletters-tool
          configPath: riff-raff.yaml
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          contentDirectories: |
            newsletters-tool-cfn:
              - cdk/cdk.out/NewslettersTool-CODE.template.json
              - cdk/cdk.out/NewslettersTool-PROD.template.json
            newsletters-tool:
              - dist/newsletters-tool.zip
            newsletters-api:
              - dist/newsletters-api.zip
